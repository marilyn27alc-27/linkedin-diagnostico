<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico de perfil LinkedIn</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 3rem 1rem; }
    .container { width: 100%; max-width: 680px; }
    h1 { font-size: 22px; font-weight: 500; color: #1a1a1a; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #666; text-align: center; margin-bottom: 2rem; }
    .card { background: #fff; border: 1px solid #e8e8e6; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    label { font-size: 13px; color: #666; display: block; margin-bottom: 8px; }
    .input-row { display: flex; gap: 8px; }
    input[type="url"] { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; transition: border 0.15s; }
    input[type="url"]:focus { border-color: #999; }
    button { height: 40px; padding: 0 20px; border-radius: 8px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 12px; background: #f5f5f3; border-radius: 8px; font-size: 14px; color: #555; }
    .status.visible { display: flex; }
    .spinner { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; margin-top: 12px; padding: 12px; background: #fff0f0; border: 1px solid #fcc; border-radius: 8px; font-size: 14px; color: #c00; }
    .error.visible { display: block; }
    .result { display: none; }
    .result.visible { display: block; }
    .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid #e8e8e6; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; color: #1a56db; flex-shrink: 0; }
    .result-name { font-size: 16px; font-weight: 500; color: #1a1a1a; }
    .result-meta { font-size: 13px; color: #666; margin-top: 2px; }
    .diagnosis { font-size: 14px; line-height: 1.85; color: #1a1a1a; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Diagnóstico de perfil LinkedIn</h1>
    <p class="subtitle">Ingresa la URL de tu perfil y recibe un análisis detallado con recomendaciones de mejora</p>

    <div class="card">
      <label for="url">URL del perfil de LinkedIn</label>
      <div class="input-row">
        <input type="url" id="url" placeholder="https://www.linkedin.com/in/tu-perfil/" />
        <button id="btn" onclick="analizar()">Analizar →</button>
      </div>
      <div class="status" id="status">
        <div class="spinner"></div>
        <span id="statusText">Iniciando...</span>
      </div>
      <div class="error" id="error"></div>
    </div>

    <div class="result card" id="result">
      <div class="result-header">
        <div class="avatar" id="initials">—</div>
        <div>
          <div class="result-name" id="resultName">—</div>
          <div class="result-meta" id="resultMeta">—</div>
        </div>
      </div>
      <div class="diagnosis" id="diagnosis"></div>
    </div>
  </div>

  <script>
    async function analizar() {
      const url = document.getElementById("url").value.trim();
      const btn = document.getElementById("btn");

      document.getElementById("error").classList.remove("visible");
      document.getElementById("result").classList.remove("visible");

      if (!url || !url.includes("linkedin.com/in/")) {
        document.getElementById("error").textContent = "Por favor ingresa una URL válida de perfil personal de LinkedIn.";
        document.getElementById("error").classList.add("visible");
        return;
      }

      btn.disabled = true;
      document.getElementById("status").classList.add("visible");
      document.getElementById("statusText").textContent = "Iniciando análisis, esto puede tardar hasta 1 minuto...";

      try {
        const res = await fetch("/.netlify/functions/diagnostico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ linkedinUrl: url }),
        });

        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Error desconocido");

        const name = data.name || "Perfil";
        const initials = name.split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();

        document.getElementById("initials").textContent = initials;
        document.getElementById("resultName").textContent = name;
        document.getElementById("resultMeta").textContent = `${data.followers} seguidores · ${data.connections} conexiones`;
        document.getElementById("diagnosis").textContent = data.diagnosis;
        document.getElementById("result").classList.add("visible");

      } catch (e) {
        document.getElementById("error").textContent = "Error: " + e.message;
        document.getElementById("error").classList.add("visible");
      } finally {
        btn.disabled = false;
        document.getElementById("status").classList.remove("visible");
      }
    }
  </script>
</body>
</html>
